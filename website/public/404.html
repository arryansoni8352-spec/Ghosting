<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>VeilGuard — Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages custom domain / root path
      var path = window.location.pathname.replace(/^\/+/, '');
      if (path && path !== 'index.html') {
        window.location.replace('/#' + path + (window.location.search || '') + (window.location.hash || ''));
      } else {
        window.location.replace('/' + (window.location.search || '') + (window.location.hash || ''));
      }
    </script>
  </head>
  <body style="background:#121A14;color:#F2EBDD;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to <a href="/" style="color:#D6A65D;">VeilGuard</a>...</p>
  </body>
</html>
