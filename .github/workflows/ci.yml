name: CI & Quality Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd engine
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Pytest
        run: |
          cd engine
          pytest tests/ -v

  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci || npm install
      - name: Build engine-interface
        run: |
          cd packages/engine-interface
          npm run build
      - name: Install desktop dependencies
        run: |
          cd apps/desktop
          npm ci || npm install
      - name: Typecheck
        run: |
          cd apps/desktop
          npm run typecheck
      - name: Run Vitest Unit Tests
        run: |
          cd apps/desktop
          npm test
      - name: Build Production Desktop Assets
        run: |
          cd apps/desktop
          npm run build
